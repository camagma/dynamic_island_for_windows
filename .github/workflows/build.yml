name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore application
        run: dotnet restore dynamic_island_prototype.sln
      - name: Build application
        run: dotnet build dynamic_island_prototype.sln --configuration Release --no-restore
      - name: Run deterministic checks
        run: dotnet run --project verification/verification.csproj --configuration Release
